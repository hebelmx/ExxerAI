<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .header h1 {
            color: #4a5568;
            margin-bottom: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-active { background: #48bb78; }
        .status-inactive { background: #f56565; }
        .status-unknown { background: #ed8936; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .card h3 {
            color: #4a5568;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .card h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            border-radius: 2px;
            margin-right: 10px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .btn-success { background: #48bb78; }
        .btn-warning { background: #ed8936; }
        .btn-danger { background: #f56565; }
        
        .server-item {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .server-url {
            font-weight: bold;
            color: #2d3748;
        }
        
        .server-details {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
        
        .health-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .health-item:last-child {
            border-bottom: none;
        }
        
        .health-value {
            font-weight: bold;
        }
        
        .process-item {
            background: #f7fafc;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        
        .process-pid {
            font-weight: bold;
            color: #667eea;
        }
        
        .tools-section {
            margin-top: 15px;
        }
        
        .tool-item {
            background: #edf2f7;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }
        
        .tool-name {
            font-weight: bold;
            color: #2d3748;
        }
        
        .tool-desc {
            font-size: 12px;
            color: #718096;
        }
        
        .loading {
            text-align: center;
            color: #718096;
            font-style: italic;
        }
        
        .last-update {
            text-align: center;
            color: #718096;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 MCP Server Dashboard</h1>
            <p>Monitor and manage your Model Context Protocol servers</p>
            <div style="margin-top: 15px;">
                <button class="btn" onclick="discoverServers()">🔍 Discover Servers</button>
                <button class="btn btn-success" onclick="startServer('http')">▶️ Start HTTP Server</button>
                <button class="btn btn-warning" onclick="startServer('standalone')">▶️ Start Standalone</button>
                <button class="btn" onclick="refreshAll()">🔄 Refresh All</button>
            </div>
        </div>
        
        <div class="grid">
            <!-- System Health Card -->
            <div class="card">
                <h3>📊 System Health</h3>
                <div id="health-content" class="loading">Loading health data...</div>
            </div>
            
            <!-- Discovered Servers Card -->
            <div class="card">
                <h3>🌐 Discovered Servers</h3>
                <div id="servers-content" class="loading">Discovering servers...</div>
            </div>
            
            <!-- Running Processes Card -->
            <div class="card">
                <h3>⚡ MCP Processes</h3>
                <div id="processes-content" class="loading">Scanning processes...</div>
            </div>
        </div>
        
        <!-- Server Tools Section -->
        <div id="tools-section" style="display: none;">
            <div class="card">
                <h3>🔧 Server Tools</h3>
                <div id="tools-content"></div>
            </div>
        </div>
        
        <div class="last-update" id="last-update"></div>
    </div>
    
    <script>
        let discoveredServers = {};
        
        // Auto-refresh every 30 seconds
        setInterval(refreshAll, 30000);
        
        // Initial load
        window.onload = function() {
            refreshAll();
        };
        
        function refreshAll() {
            updateHealth();
            discoverServers();
            updateProcesses();
            updateLastUpdate();
        }
        
        function updateHealth() {
            fetch('/api/health')
                .then(response => response.json())
                .then(data => {
                    const content = document.getElementById('health-content');
                    if (data.error) {
                        content.innerHTML = `<div style="color: #f56565;">Error: ${data.error}</div>`;
                        return;
                    }
                    
                    content.innerHTML = `
                        <div class="health-item">
                            <span>CPU Usage</span>
                            <span class="health-value">${data.cpu_percent?.toFixed(1) || 'N/A'}%</span>
                        </div>
                        <div class="health-item">
                            <span>Memory Usage</span>
                            <span class="health-value">${data.memory_percent?.toFixed(1) || 'N/A'}%</span>
                        </div>
                        <div class="health-item">
                            <span>Disk Usage</span>
                            <span class="health-value">${data.disk_percent?.toFixed(1) || 'N/A'}%</span>
                        </div>
                        <div class="health-item">
                            <span>Python Version</span>
                            <span class="health-value">${data.python_version || 'N/A'}</span>
                        </div>
                    `;
                })
                .catch(error => {
                    document.getElementById('health-content').innerHTML = `<div style="color: #f56565;">Failed to load health data</div>`;
                });
        }
        
        function discoverServers() {
            document.getElementById('servers-content').innerHTML = '<div class="loading">Discovering servers...</div>';
            
            fetch('/api/discover')
                .then(response => response.json())
                .then(data => {
                    discoveredServers = data.servers;
                    const content = document.getElementById('servers-content');
                    
                    if (Object.keys(data.servers).length === 0) {
                        content.innerHTML = '<div style="color: #718096;">No MCP servers found</div>';
                        return;
                    }
                    
                    let html = '';
                    for (const [serverId, server] of Object.entries(data.servers)) {
                        html += `
                            <div class="server-item">
                                <div class="server-url">
                                    <span class="status-indicator status-active"></span>
                                    ${server.url}
                                </div>
                                <div class="server-details">
                                    Response: ${(server.response_time * 1000).toFixed(0)}ms | 
                                    Last seen: ${new Date(server.last_seen).toLocaleTimeString()}
                                    <button class="btn" style="margin-left: 10px; padding: 5px 10px; font-size: 12px;" 
                                            onclick="loadServerTools('${serverId}')">View Tools</button>
                                </div>
                            </div>
                        `;
                    }
                    content.innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('servers-content').innerHTML = `<div style="color: #f56565;">Failed to discover servers</div>`;
                });
        }
        
        function updateProcesses() {
            fetch('/api/processes')
                .then(response => response.json())
                .then(data => {
                    const content = document.getElementById('processes-content');
                    
                    if (data.length === 0) {
                        content.innerHTML = '<div style="color: #718096;">No MCP processes found</div>';
                        return;
                    }
                    
                    let html = '';
                    data.forEach(process => {
                        html += `
                            <div class="process-item">
                                <div><span class="process-pid">PID ${process.pid}</span> - ${process.name}</div>
                                <div style="margin-top: 5px; color: #718096;">${process.cmdline}</div>
                                <div style="margin-top: 5px; font-size: 10px;">
                                    CPU: ${process.cpu_percent.toFixed(1)}% | 
                                    Memory: ${process.memory_percent.toFixed(1)}%
                                </div>
                            </div>
                        `;
                    });
                    content.innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('processes-content').innerHTML = `<div style="color: #f56565;">Failed to load processes</div>`;
                });
        }
        
        function loadServerTools(serverId) {
            const toolsSection = document.getElementById('tools-section');
            const toolsContent = document.getElementById('tools-content');
            
            toolsSection.style.display = 'block';
            toolsContent.innerHTML = '<div class="loading">Loading tools...</div>';
            
            fetch(`/api/server/${serverId}/tools`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        toolsContent.innerHTML = `<div style="color: #f56565;">Error: ${data.error}</div>`;
                        return;
                    }
                    
                    let html = `<h4>Tools for ${discoveredServers[serverId].url}</h4><div class="tools-section">`;
                    
                    if (data.tools && data.tools.length > 0) {
                        data.tools.forEach(tool => {
                            html += `
                                <div class="tool-item">
                                    <div class="tool-name">${tool.name}</div>
                                    <div class="tool-desc">${tool.description}</div>
                                    <button class="btn" style="margin-top: 5px; padding: 5px 10px; font-size: 12px;" 
                                            onclick="testTool('${serverId}', '${tool.name}')">Test Tool</button>
                                </div>
                            `;
                        });
                    } else {
                        html += '<div style="color: #718096;">No tools available</div>';
                    }
                    
                    html += '</div>';
                    toolsContent.innerHTML = html;
                })
                .catch(error => {
                    toolsContent.innerHTML = `<div style="color: #f56565;">Failed to load tools</div>`;
                });
        }
        
        function testTool(serverId, toolName) {
            const toolData = {
                name: toolName,
                arguments: {}
            };
            
            fetch(`/api/server/${serverId}/call`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(toolData)
            })
            .then(response => response.json())
            .then(data => {
                alert(`Tool Result:\n${JSON.stringify(data, null, 2)}`);
            })
            .catch(error => {
                alert(`Tool Error: ${error}`);
            });
        }
        
        function startServer(serverType) {
            fetch(`/api/start-server/${serverType}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert(`Error: ${data.error}`);
                    } else {
                        alert(`${data.message}`);
                        setTimeout(() => {
                            discoverServers();
                        }, 2000);
                    }
                })
                .catch(error => {
                    alert(`Failed to start server: ${error}`);
                });
        }
        
        function updateLastUpdate() {
            document.getElementById('last-update').innerText = 
                `Last updated: ${new Date().toLocaleTimeString()}`;
        }
    </script>
</body>
</html>
